<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Suto Control</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a href="#content" class="skip">Skip to content</a>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" aria-label="Suto dashboard"><span class="brand-mark">s.</span><span>suto<span class="brand-caption">CONTROL</span></span></a>
      <div class="nav-label">WORKSPACE</div>
      <nav aria-label="Main navigation">
        <a href="#dashboard" data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</a>
        <a href="#sessions" data-page="sessions"><span class="nav-icon">▤</span>Sessions</a>
        <a href="#models" data-page="models"><span class="nav-icon">◈</span>Models</a>
        <a href="#logs" data-page="logs"><span class="nav-icon">≡</span>Logs</a>
        <a href="#mcp" data-page="mcp"><span class="nav-icon">⌘</span>MCP<span class="nav-note">—</span></a>
      </nav>
      <div class="nav-label second-label">MANAGE</div>
      <nav aria-label="Management">
        <a href="#settings" data-page="settings"><span class="nav-icon">⚙</span>Settings</a>
        <a href="#system" data-page="system"><span class="nav-icon">↳</span>System</a>
      </nav>
      <div class="sidebar-bottom"><span class="local-dot"></span><div>Local workspace<small>Private to this machine</small></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div>Suto <span class="slash">/</span> <span id="breadcrumb">Dashboard</span></div><span id="connection" class="connection">Connecting</span></header>
      <main id="content" tabindex="-1"></main>
      <footer><span>SUTO CONTROL</span><span>Your machine. Your workspace.</span></footer>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
