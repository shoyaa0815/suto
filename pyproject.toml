[project]
name = "suto"
version = "0.1.0"
description = "Chat bot powered by a local Ollama model, focused on building out its tool-calling harness"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7.1",
    "aiohttp>=3.14.3",
    "python-dotenv>=1.2.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.14.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
