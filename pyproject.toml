[project]
name = "suto"
version = "0.1.0"
description = "Ai agent powered by a local Ollama model with request-scoped tools"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.1",
    "aiohttp>=3.14.3",
    "python-dotenv>=1.2.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.16.1",
    "lingua-language-detector>=2.2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
